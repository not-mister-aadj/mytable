<!--
  Supabase Auth → Email Templates → Magic Link
  Subject: Je inlogcode: {{ .Token }}

  Uses {{ .Token }} (OTP) - required by the MyTable login modal.
  Do not use {{ .ConfirmationURL }} for this flow.

  Note: new / unconfirmed users get the Confirm signup template instead -
  keep that one in sync (emails/supabase-confirm-signup.html).
-->
<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Je inlogcode voor MyTable</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #faf3ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
        Arial, sans-serif;
      color: #2a1218;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #faf3ef; padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 560px; margin: 0 auto"
          >
            <!-- Brand -->
            <tr>
              <td align="center" style="padding-bottom: 24px">
                <p
                  style="
                    margin: 0 0 6px;
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    font-size: 30px;
                    font-weight: 400;
                    color: #600d1e;
                    line-height: 1.2;
                  "
                >
                  MyTable
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 13px;
                    line-height: 18px;
                    color: #7a6568;
                  "
                >
                  Goede smaak. Goed gezelschap.
                </p>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td
                style="
                  background-color: #ffffff;
                  border-radius: 16px;
                  box-shadow: 0 2px 14px rgba(96, 13, 30, 0.06);
                  padding: 28px 40px;
                "
              >
                <h1
                  style="
                    margin: 0 0 12px;
                    font-family: Georgia, 'Times New Roman', Times, serif;
                    font-size: 28px;
                    font-weight: 400;
                    line-height: 1.15;
                    color: #600d1e;
                  "
                >
                  Je inlogcode
                </h1>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 14px;
                    line-height: 22px;
                    color: #7a6568;
                  "
                >
                  Gebruik deze code om in te loggen bij MyTable. De code is kort
                  geldig en kun je maar één keer gebruiken.
                </p>

                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 9px;
                    font-weight: 600;
                    letter-spacing: 0.13em;
                    text-transform: uppercase;
                    color: #c19a6b;
                    text-align: center;
                  "
                >
                  Inlogcode
                </p>
                <p
                  style="
                    margin: 0 0 10px;
                    text-align: center;
                    font-size: 32px;
                    font-weight: 700;
                    letter-spacing: 0.28em;
                    color: #600d1e;
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                      Roboto, Helvetica, Arial, sans-serif;
                  "
                >
                  {{ .Token }}
                </p>
                <p
                  style="
                    margin: 0;
                    text-align: center;
                    font-size: 12px;
                    line-height: 18px;
                    color: #7a6568;
                  "
                >
                  Voor {{ .Email }}
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding-top: 40px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      style="
                        border-top: 1px solid #ede4da;
                        padding-top: 28px;
                        text-align: center;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 12px;
                          font-family: Georgia, 'Times New Roman', Times, serif;
                          font-size: 16px;
                          color: #600d1e;
                        "
                      >
                        MyTable
                      </p>
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 13px;
                          line-height: 20px;
                          color: #7a6568;
                        "
                      >
                        Vragen?
                        <a
                          href="mailto:info@mytable.club"
                          style="color: #600d1e; text-decoration: none"
                          >info@mytable.club</a>
                      </p>
                      <p
                        style="
                          margin: 0 0 14px;
                          font-size: 14px;
                          line-height: 22px;
                        "
                      >
                        <a
                          href="https://instagram.com/mytable.club"
                          style="color: #600d1e; text-decoration: none"
                          >Instagram</a>
                        ·
                        <a
                          href="https://www.mytable.club"
                          style="color: #600d1e; text-decoration: none"
                          >mytable.club</a>
                      </p>
                      <p
                        style="
                          margin: 0;
                          font-size: 12px;
                          line-height: 18px;
                          color: #7a6568;
                        "
                      >
                        Verzonden door MyTable
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
